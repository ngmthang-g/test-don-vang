name: Build Target ID EXE
on:
  push:
    branches:
      - exe/target-id-loop
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Expand approved source archive
        shell: pwsh
        run: |
          Expand-Archive -Path "source/TestDonVang_TargetID_SOURCE_APPROVED.zip" -DestinationPath "unpacked" -Force
          if (-not (Test-Path "unpacked/TestDonVang_TargetID/CMakeLists.txt")) { throw "Missing project in archive" }
      - name: Restore exact 10.6 coordinate normalizer and F8 regression tests
        shell: pwsh
        run: |
          $project = "unpacked/TestDonVang_TargetID"
          Copy-Item "src/saved_hidden_click.h" "$project/src/saved_hidden_click.h" -Force
          Copy-Item "src/saved_hidden_click_test.cpp" "$project/src/saved_hidden_click_test.cpp" -Force
          if (-not (Select-String -Path "$project/src/saved_hidden_click.h" -Pattern "fixed_slot_sell_logic::NormalizeClientCoordinate" -SimpleMatch)) { throw "Wrong 10.6 coordinate scale" }
      - name: Verify requested feature scope
        working-directory: unpacked/TestDonVang_TargetID
        run: python scripts/verify_scope.py
      - name: Configure Visual Studio x64
        working-directory: unpacked/TestDonVang_TargetID
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build Release
        working-directory: unpacked/TestDonVang_TargetID
        run: cmake --build build --config Release --parallel
      - name: Run tests
        working-directory: unpacked/TestDonVang_TargetID
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package EXE and Bridge DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "artifact" | Out-Null
          $dir = "unpacked/TestDonVang_TargetID/build/Release"
          Copy-Item "$dir/TestDonVang_TargetID.exe" "artifact/"
          Copy-Item "$dir/ThanLongCleanRouteBridge.dll" "artifact/"
          $rows = foreach ($file in Get-ChildItem artifact -File) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          Set-Content -Encoding ascii "artifact/SHA256SUMS.txt" $rows
      - name: Upload EXE and DLL
        uses: actions/upload-artifact@v4
        with:
          name: TestDonVang-TargetID-Windows-x64
          path: artifact/*
          if-no-files-found: error
          retention-days: 30
